[project]
name = "av-morning-star"
version = "0.4.6"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
# uQ's uq-theme, vendored unchanged (uq/native.toml; scripts/check-uq-native.sh)
extend-exclude = ["themes/uq_theme.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"main.py" = ["E402"]  # PyQt imports after PATH / QT env setup

[tool.av-morning-star.loc]
warn = 200
fail = 400
